<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>DISIC Designing Innovation</title><meta name="claude:viewport-fit-sides" content="cover"><meta name="description" content="DISIC Designing Innovation: ingeniería de detalle, cálculo, documentación técnica y de calidad para proyectos en Colombia y el exterior."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Saira:wdth,wght@100..125,500..800&display=swap"><style id="disic-css">/* Concepto: hoja técnica en negro (el mismo fondo del logo), filetes dorados como cotas, retícula de plano tenue y pie en forma de cajetín. */
:root{
  --negro:#0D0D0D;      /* fondo: idéntico al fondo del logo */
  --carbon:#141414;     /* superficies */
  --carbon-2:#1B1B1B;   /* superficies elevadas, campos */
  --linea:#2A2926;      /* líneas y bordes, con sesgo cálido hacia el dorado */
  --acero:#A3A2A0;      /* texto secundario (arco plateado del logo) */
  --plata:#DCDCDA;      /* texto de lectura */
  --blanco:#F6F6F4;     /* titulares */
  --oro:#E9A402;        /* acento: engranaje del logo */
  --oro-claro:#FDD732;  /* brillo puntual */
  --ok:#5BB37A; --error:#E2675A;
  --f-display:"Saira",ui-sans-serif,"Segoe UI",Arial,sans-serif;
  --f-texto:"IBM Plex Sans",ui-sans-serif,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:4px;
  --ancho:1180px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:88px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--negro);color:var(--plata);font-family:var(--f-texto);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--negro)}
a{color:var(--oro)}
a:hover{color:var(--oro-claro)}
:focus-visible{outline:2px solid var(--oro-claro);outline-offset:3px}
h1,h2,h3,h4{font-family:var(--f-display);color:var(--blanco);line-height:1.12;text-wrap:balance;margin:0}
p{margin:0}
ul{margin:0;padding-left:1.1em}
button,input,select,textarea{font:inherit;color:inherit}
.envoltura{max-width:var(--ancho);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:.82rem;letter-spacing:.02em}
.ceja{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--oro);display:flex;align-items:center;gap:.6rem}
.ceja::before{content:"";width:28px;height:2px;background:var(--oro)}
.vacio{color:var(--acero)}
.marcador{color:var(--oro);font-family:var(--f-mono);font-size:.85em}

/* ---------- Encabezado ---------- */
.cabecera{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(13,13,13,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--linea)}
.cabecera .envoltura{display:flex;align-items:center;gap:1.5rem;min-height:72px}
.marca{display:flex;align-items:center;flex-shrink:0}
.marca img{height:52px;width:auto;display:block}
.nav{display:flex;gap:1.4rem;margin-left:auto;align-items:center}
.nav a{color:var(--plata);text-decoration:none;font-size:.93rem;font-weight:500;padding:.3rem 0;border-bottom:2px solid transparent}
.nav a:hover{color:var(--blanco);border-bottom-color:var(--oro)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.25rem;border-radius:var(--r);font-weight:600;font-size:.95rem;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:background .15s,color .15s,border-color .15s;white-space:nowrap}
.btn-oro{background:var(--oro);color:#111}
.btn-oro:hover{background:var(--oro-claro);color:#111}
.btn-linea{border-color:var(--acero);color:var(--blanco);background:transparent}
.btn-linea:hover{border-color:var(--oro);color:var(--oro-claro)}
.btn-chico{padding:.45rem .8rem;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.menu-btn{display:none;margin-left:auto;background:none;border:1px solid var(--linea);border-radius:var(--r);padding:.5rem .7rem;cursor:pointer;color:var(--blanco)}
@media (max-width:980px){
  .nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;gap:0;background:var(--negro);border-bottom:1px solid var(--linea);padding:.5rem max(16px,env(safe-area-inset-right,0px)) 1rem max(16px,env(safe-area-inset-left,0px))}
  .nav.abierto{display:flex}
  .nav a{padding:.8rem 0;border-bottom:1px solid var(--linea)}
  .nav .btn{margin-top:.8rem}
  .menu-btn{display:block}
  .marca img{height:44px}
}

/* ---------- Héroe ---------- */
.heroe{position:relative;overflow:hidden;border-bottom:1px solid var(--linea)}
.heroe::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--linea) 1px,transparent 1px),linear-gradient(90deg,var(--linea) 1px,transparent 1px);background-size:48px 48px;opacity:.35;mask-image:radial-gradient(ellipse at 70% 40%,#000 0%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 70% 40%,#000 0%,transparent 70%)}
.heroe .envoltura{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:2.5rem;align-items:center;padding-block:4.5rem 3.5rem}
.heroe h1{font-size:clamp(2.1rem,4.6vw,3.5rem);font-weight:800;font-stretch:112%;letter-spacing:-.01em;margin-top:1.1rem}
.heroe h1 .oro{color:var(--oro)}
.heroe .sub{margin-top:1.2rem;font-size:1.12rem;color:var(--plata);max-width:58ch}
.acciones{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:2rem}
.heroe-logo{position:relative}
.heroe-logo img{width:100%;height:auto;display:block;-webkit-mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 62%,transparent 100%)}
.codigo-muestra{margin-top:1rem;display:flex;flex-wrap:wrap;gap:.4rem 1rem;color:var(--acero)}
.codigo-muestra b{color:var(--oro);font-weight:500}
.normas{border-top:1px solid var(--linea);background:var(--carbon)}
.normas .envoltura{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.4rem;padding-block:1.1rem}
.normas span.mono{color:var(--acero)}
.chip{font-family:var(--f-mono);font-size:.78rem;padding:.25rem .6rem;border:1px solid var(--linea);border-radius:2px;color:var(--plata);white-space:nowrap}
@media (max-width:860px){.heroe .envoltura{grid-template-columns:1fr;padding-block:3rem 2.5rem}.heroe-logo{order:-1;max-width:420px}}

/* ---------- Secciones ---------- */
.seccion{padding-block:5rem;border-bottom:1px solid var(--linea)}
.seccion.alterna{background:var(--carbon)}
.titulo-sec{display:grid;gap:.9rem;margin-bottom:2.6rem;max-width:760px}
.titulo-sec h2{font-size:clamp(1.7rem,3.2vw,2.5rem);font-weight:700;font-stretch:110%}
.titulo-sec p{color:var(--acero);font-size:1.05rem;max-width:65ch}
.rejilla{display:grid;gap:1.25rem}
.r2{grid-template-columns:repeat(2,minmax(0,1fr))}
.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.r4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.r3,.r4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.r2,.r3,.r4{grid-template-columns:1fr}.seccion{padding-block:3.5rem}}
.bloque{min-width:0}
.bloque h3{font-size:1.15rem;font-weight:700;margin-bottom:.5rem}
.bloque p{color:var(--acero)}

/* Ventajas: filete dorado superior, sin tarjeta */
.ventaja{border-top:2px solid var(--oro);padding-top:1.1rem;min-width:0}
.ventaja h3{font-size:1.08rem;margin-bottom:.45rem}
.ventaja p{color:var(--acero);font-size:.95rem}

/* DISIC acrónimo */
.acronimo{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--linea)}
.letra{padding:1.4rem 1.1rem;border-right:1px solid var(--linea);min-width:0}
.letra:last-child{border-right:0}
.letra .l{font-family:var(--f-display);font-weight:800;font-stretch:125%;font-size:2.6rem;color:var(--blanco);line-height:1}
.letra .l span{color:var(--oro)}
.letra h3{font-size:.9rem;letter-spacing:.12em;text-transform:uppercase;color:var(--oro);margin:.7rem 0 .4rem}
.letra p{font-size:.9rem;color:var(--acero)}
@media (max-width:860px){.acronimo{grid-template-columns:1fr}.letra{border-right:0;border-bottom:1px solid var(--linea);display:grid;grid-template-columns:3.2rem 1fr;gap:0 1rem;align-items:start}.letra:last-child{border-bottom:0}.letra .l{grid-row:span 2}.letra h3{margin-top:0}}

.banner-img{width:100%;height:auto;display:block;border:1px solid var(--linea);margin-top:2.5rem}
.mv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem;margin-top:2.5rem}
.mv>div{background:var(--carbon-2);border-left:3px solid var(--oro);padding:1.4rem 1.5rem;min-width:0}
.mv h3{font-size:1.05rem;margin-bottom:.5rem}
@media (max-width:620px){.mv{grid-template-columns:1fr}}
.persona{display:flex;gap:1rem;align-items:center;border:1px solid var(--linea);padding:1rem;min-width:0}
.persona .foto{width:72px;height:72px;flex-shrink:0;object-fit:cover;background:var(--carbon-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--oro);font-size:1.4rem}
.persona h3{font-size:1rem}
.persona p{font-size:.88rem;color:var(--acero)}

/* Servicios */
.servicio{border:1px solid var(--linea);background:var(--negro);min-width:0}
.servicio summary{list-style:none;cursor:pointer;padding:1.3rem 1.4rem;display:grid;grid-template-columns:auto 1fr auto;gap:.2rem 1rem;align-items:start}
.servicio summary::-webkit-details-marker{display:none}
.servicio .cod{font-family:var(--f-mono);font-size:.75rem;color:#111;background:var(--oro);padding:.15rem .45rem;border-radius:2px;grid-row:span 2;align-self:start;margin-top:.15rem;min-width:3.6rem;text-align:center}
.servicio h3{font-size:1.08rem;font-weight:700}
.servicio .desc{grid-column:2;color:var(--acero);font-size:.93rem}
.servicio .mas{grid-row:1;grid-column:3;font-family:var(--f-mono);color:var(--oro);font-size:1.2rem;transition:transform .2s}
.servicio[open]{border-color:var(--oro)}
.servicio[open] .mas{transform:rotate(45deg)}
.detalle{padding:0 1.4rem 1.5rem;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.2rem 2rem;border-top:1px solid var(--linea);padding-top:1.3rem}
.detalle h4{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--oro);font-weight:500;margin-bottom:.45rem}
.detalle ul{color:var(--plata);font-size:.92rem;display:grid;gap:.25rem}
.detalle .chips{display:flex;flex-wrap:wrap;gap:.35rem}
.detalle .pie-det{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;justify-content:space-between}
@media (max-width:620px){.detalle{grid-template-columns:1fr}}

/* Metodología: secuencia real */
.pasos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;counter-reset:paso;border-top:1px solid var(--linea)}
.paso{padding:1.4rem 1rem 0 0;position:relative;min-width:0}
.paso::before{counter-increment:paso;content:counter(paso,decimal-leading-zero);font-family:var(--f-mono);color:var(--oro);font-size:.85rem;display:block;margin-bottom:.6rem}
.paso::after{content:"";position:absolute;top:-5px;left:0;width:9px;height:9px;background:var(--oro);transform:rotate(45deg)}
.paso h3{font-size:1rem;margin-bottom:.4rem}
.paso p{font-size:.88rem;color:var(--acero)}
@media (max-width:980px){.pasos{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:1.6rem}}
@media (max-width:620px){.pasos{grid-template-columns:1fr;border-top:0;border-left:1px solid var(--linea)}.paso{padding:0 0 0 1.4rem}.paso::after{top:4px;left:-5px}}

/* Sectores */
.sector{border-left:2px solid var(--linea);padding:.2rem 0 .2rem 1rem;min-width:0;transition:border-color .15s}
.sector:hover{border-left-color:var(--oro)}
.sector h3{font-size:1rem;margin-bottom:.3rem}
.sector p{font-size:.9rem;color:var(--acero)}

/* Proyectos */
.filtros{display:flex;flex-wrap:wrap;gap:.8rem;margin-bottom:1.6rem;align-items:end}
.filtros label{display:grid;gap:.3rem;font-size:.8rem;color:var(--acero);min-width:0}
.proyecto{border:1px solid var(--linea);background:var(--negro);display:flex;flex-direction:column;min-width:0}
.proyecto img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;border-bottom:1px solid var(--linea);max-width:100%}
.proyecto .cuerpo{padding:1.2rem 1.3rem 1.4rem;display:grid;gap:.6rem}
.proyecto h3{font-size:1.08rem}
.meta{display:flex;flex-wrap:wrap;gap:.35rem}
.estado{font-family:var(--f-mono);font-size:.72rem;padding:.15rem .5rem;border-radius:2px;border:1px solid}
.estado.ejecutado{color:var(--ok);border-color:var(--ok)}
.estado.desarrollo{color:var(--oro);border-color:var(--oro)}
.estado.referencial{color:var(--acero);border-color:var(--acero)}
.proyecto dl{margin:0;display:grid;gap:.45rem;font-size:.9rem}
.proyecto dt{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--oro)}
.proyecto dd{margin:0;color:var(--plata)}
.vacio-caja{border:1px dashed var(--linea);padding:2.2rem;display:grid;gap:.7rem;max-width:720px}
.vacio-caja h3{font-size:1.15rem}
.vacio-caja p{color:var(--acero)}

/* Recursos */
.pestanas{display:flex;flex-wrap:wrap;gap:.4rem;border-bottom:1px solid var(--linea);margin-bottom:1.8rem}
.pestana{background:none;border:0;border-bottom:2px solid transparent;padding:.7rem 1rem;cursor:pointer;color:var(--acero);font-weight:500}
.pestana[aria-selected="true"]{color:var(--blanco);border-bottom-color:var(--oro)}
.articulo{border-top:1px solid var(--linea);padding-block:1.1rem;display:grid;grid-template-columns:7rem minmax(0,1fr) auto;gap:1rem;align-items:baseline}
.articulo:last-child{border-bottom:1px solid var(--linea)}
.articulo h3{font-size:1.02rem}
.articulo p{color:var(--acero);font-size:.92rem;margin-top:.25rem}
@media (max-width:620px){.articulo{grid-template-columns:1fr;gap:.3rem}}
.faq details{border-top:1px solid var(--linea)}
.faq details:last-child{border-bottom:1px solid var(--linea)}
.faq summary{cursor:pointer;padding:1rem 0;font-weight:600;color:var(--blanco);list-style:none;display:flex;justify-content:space-between;gap:1rem}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--oro);font-family:var(--f-mono)}
.faq details[open] summary::after{content:"−"}
.faq details p{padding-bottom:1.1rem;color:var(--acero);max-width:70ch}
.tabla-scroll{overflow-x:auto;border:1px solid var(--linea)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.92rem}
th,td{text-align:left;padding:.7rem .9rem;border-bottom:1px solid var(--linea);vertical-align:top}
th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--oro);font-weight:500;background:var(--carbon-2)}
td:first-child{color:var(--blanco);font-weight:500;white-space:nowrap}

/* Pagos */
.pago{border:1px solid var(--linea);padding:1.3rem;display:grid;gap:.8rem;min-width:0}
.aviso{border-left:3px solid var(--oro);background:var(--carbon-2);padding:1rem 1.2rem;font-size:.92rem;color:var(--plata);margin-top:1.6rem;max-width:760px}

/* Contacto */
.contacto{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:2.5rem;align-items:start}
@media (max-width:860px){.contacto{grid-template-columns:1fr}}
form.formulario{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.campo{display:grid;gap:.35rem;min-width:0}
.campo.ancho{grid-column:1/-1}
.campo label{font-size:.85rem;color:var(--plata);font-weight:500}
.campo label .req{color:var(--oro)}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=file],select,textarea{width:100%;background:var(--carbon-2);border:1px solid var(--linea);border-radius:var(--r);padding:.7rem .8rem;color:var(--blanco);min-width:0}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--oro);outline:none}
.campo .err{font-size:.8rem;color:var(--error)}
.casilla{display:flex;gap:.6rem;align-items:flex-start;font-size:.88rem;color:var(--acero)}
.casilla input{margin-top:.25rem;accent-color:var(--oro)}
@media (max-width:620px){form.formulario{grid-template-columns:1fr}}
.datos-contacto{display:grid;gap:1.2rem}
.dato{border-top:1px solid var(--linea);padding-top:.9rem;display:grid;gap:.25rem}
.dato .etq{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--oro)}
.dato .val{color:var(--blanco);word-break:break-word}
.fila-copiar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.resultado{grid-column:1/-1;border:1px solid var(--oro);padding:1.2rem;display:grid;gap:.8rem}
.resultado pre{white-space:pre-wrap;word-break:break-word;background:var(--negro);border:1px solid var(--linea);padding:.9rem;font-family:var(--f-mono);font-size:.82rem;margin:0;max-height:260px;overflow:auto}

/* CTA final */
.cierre{padding-block:4.5rem;background:var(--carbon);border-bottom:1px solid var(--oro)}
.cierre .envoltura{display:flex;flex-wrap:wrap;gap:1.5rem;align-items:center;justify-content:space-between}
.cierre h2{font-size:clamp(1.5rem,3vw,2.2rem);max-width:28ch}

/* Pie: cajetín de plano */
.pie{padding-block:2.5rem 3rem}
.cajetin{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(4,minmax(0,1fr));border:1px solid var(--acero)}
.cajetin>div{border-right:1px solid var(--linea);padding:.8rem 1rem;min-width:0}
.cajetin>div:last-child{border-right:0}
.cajetin .etq{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acero);display:block;margin-bottom:.25rem}
.cajetin .val{color:var(--blanco);font-size:.9rem;word-break:break-word}
.cajetin img{height:40px;width:auto;display:block;margin-bottom:.4rem}
@media (max-width:860px){.cajetin{grid-template-columns:repeat(2,minmax(0,1fr))}.cajetin>div{border-bottom:1px solid var(--linea)}.cajetin>div:first-child{grid-column:1/-1}}
.pie-enlaces{display:flex;flex-wrap:wrap;gap:.6rem 1.4rem;margin-top:1.2rem;font-size:.88rem;align-items:center}
.pie-enlaces a,.pie-enlaces button{color:var(--acero);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.pie-enlaces a:hover,.pie-enlaces button:hover{color:var(--oro)}
.lema{margin-top:1.4rem;color:var(--acero);font-size:.9rem;max-width:70ch}

/* WhatsApp flotante */
.wa{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--oro);color:#111;border-radius:999px;padding:.8rem 1.1rem;font-weight:700;text-decoration:none;display:flex;align-items:center;gap:.5rem;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.wa:hover{background:var(--oro-claro);color:#111}
.wa svg{width:20px;height:20px;fill:currentColor}

/* Modal y panel de administración */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:80;display:flex;justify-content:flex-end}
.velo.centro{justify-content:center;align-items:center;padding:16px}
.modal{background:var(--carbon);border:1px solid var(--oro);max-width:560px;width:100%;padding:1.6rem;display:grid;gap:1rem;max-height:90vh;overflow:auto}
.modal h2{font-size:1.3rem}
.modal p{color:var(--plata)}
.panel{background:var(--carbon);width:min(760px,100%);height:100%;overflow-y:auto;border-left:1px solid var(--oro);display:flex;flex-direction:column}
.panel-cab{position:sticky;top:0;z-index:2;background:var(--negro);border-bottom:1px solid var(--linea);padding:calc(1rem + env(safe-area-inset-top,0px)) max(16px,calc(1.2rem + env(safe-area-inset-right,0px))) 1rem 1.2rem;display:grid;gap:.8rem}
.panel-cab .fila{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between}
.panel-cab h2{font-size:1.15rem}
.panel-cuerpo{padding:1.2rem max(16px,calc(1.2rem + env(safe-area-inset-right,0px))) calc(2rem + env(safe-area-inset-bottom,0px)) 1.2rem;display:grid;gap:1.2rem}
.estado-guardado{font-size:.85rem;color:var(--acero)}
.estado-guardado.ok{color:var(--ok)}
.estado-guardado.mal{color:var(--error)}
.estado-guardado.pend{color:var(--oro)}
.item-admin{border:1px solid var(--linea);padding:1rem;display:grid;gap:.8rem;background:var(--negro)}
.item-admin .cab-item{display:flex;justify-content:space-between;gap:.6rem;align-items:center;flex-wrap:wrap}
.item-admin .cab-item strong{color:var(--blanco)}
.rejilla-campos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
@media (max-width:620px){.rejilla-campos{grid-template-columns:1fr}}
.mini-img{max-width:180px;border:1px solid var(--linea);display:block}
.ayuda{font-size:.8rem;color:var(--acero)}
.btn-peligro{border-color:var(--error);color:var(--error);background:transparent}
.btn-peligro:hover{background:var(--error);color:#111}
.medidor{height:6px;background:var(--carbon-2);border:1px solid var(--linea)}
.medidor>span{display:block;height:100%;background:var(--oro)}
.oculto-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Sectores desplegables */
.sectores-mod{align-items:start}
.sector-mod{border:1px solid var(--linea);border-left:3px solid var(--linea);background:var(--negro);min-width:0;transition:border-color .15s}
.sector-mod:hover,.sector-mod[open]{border-left-color:var(--oro)}
.sector-mod[open]{border-color:var(--oro)}
.sector-mod summary{list-style:none;cursor:pointer;padding:1.1rem 1.2rem;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem;align-items:start}
.sector-mod summary::-webkit-details-marker{display:none}
.sector-mod h3{font-size:1.05rem;margin-bottom:.3rem}
.sector-mod summary p{font-size:.92rem;color:var(--acero)}
.sector-mod .mas{font-family:var(--f-mono);color:var(--oro);font-size:1.3rem;line-height:1;transition:transform .2s}
.sector-mod[open] .mas{transform:rotate(45deg)}
.fases{list-style:none;margin:0;padding:1rem 1.2rem 1.2rem;border-top:1px solid var(--linea);display:grid;gap:.85rem}
.fases li{display:grid;gap:.2rem;padding-left:.9rem;border-left:2px solid var(--oro)}
.fases .fase{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--oro)}
.fases p{font-size:.9rem;color:var(--plata)}

/* Metodología desplegable */
.etapas{display:grid;gap:.8rem;counter-reset:none}
.etapa{border:1px solid var(--linea);background:var(--negro);min-width:0}
.etapa[open]{border-color:var(--oro)}
.etapa summary{list-style:none;cursor:pointer;padding:1.1rem 1.2rem;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1.1rem;align-items:start}
.etapa summary::-webkit-details-marker{display:none}
.etapa .num{font-family:var(--f-mono);color:#111;background:var(--oro);padding:.2rem .5rem;border-radius:2px;font-size:.85rem;margin-top:.1rem}
.etapa h3{font-size:1.08rem;margin-bottom:.3rem}
.etapa summary p{color:var(--acero);font-size:.93rem}
.etapa .mas{font-family:var(--f-mono);color:var(--oro);font-size:1.3rem;line-height:1;transition:transform .2s}
.etapa[open] .mas{transform:rotate(45deg)}
.etapa-det{border-top:1px solid var(--linea);padding:1.2rem 1.2rem 1.4rem;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.2rem 2rem}
.etapa-det h4{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--oro);font-weight:500;margin-bottom:.5rem}
.etapa-det ul{display:grid;gap:.35rem;font-size:.92rem;color:var(--plata)}
.etapa-det .ejemplo{grid-column:1/-1;background:var(--carbon-2);border-left:3px solid var(--oro);padding:.9rem 1.1rem}
.etapa-det .ejemplo p{font-size:.92rem;color:var(--plata)}
@media (max-width:620px){.etapa-det{grid-template-columns:1fr}.etapa summary{gap:.8rem}}

/* ---------- utilidades ---------- */
function h(tag, props, ...hijos){
  const el = document.createElement(tag);
  if(props) for(const [k,v] of Object.entries(props)){
    if(v==null || v===false) continue;
    if(k==="class") el.className=v;
    else if(k==="text") el.textContent=v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if(k==="hidden") el.hidden=!!v;
    else if(k==="value") el.value=v;
    else if(k==="checked") el.checked=!!v;
    else el.setAttribute(k, v===true?"":v);
  }
  for(const c of hijos.flat()){ if(c==null||c===false) continue; el.append(c instanceof Node?c:document.createTextNode(String(c))); }
  return el;
}
const PEND = "[Completar información]";
function txt(v, def){ v=(v==null?"":String(v)).trim(); return v || (def===undefined?PEND:def); }
function esPendiente(v){ return !String(v||"").trim(); }
function urlSegura(u, hosts){
  try{
    const x = new URL(String(u||"").trim());
    if(x.protocol!=="https:") return "";
    if(hosts && !hosts.some(d=>x.hostname===d || x.hostname.endsWith("."+d))) return "";
    return x.href;
  }catch(e){ return ""; }
}
function imgSegura(s){ return /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(String(s||"")) ? s : ""; }
function soloDigitos(s){ return String(s||"").replace(/\D/g,""); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function fechaLegible(iso){
  if(!iso) return "—";
  const m=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const d=new Date(iso+"T12:00:00"); if(isNaN(d)) return iso;
  return d.getDate()+" de "+m[d.getMonth()]+" de "+d.getFullYear();
}
async function copiar(texto, boton){
  try{ await navigator.clipboard.writeText(texto); if(boton){ const t=boton.textContent; boton.textContent="Copiado"; setTimeout(()=>boton.textContent=t,1600);} return true; }
  catch(e){ if(boton){ const t=boton.textContent; boton.textContent="Selecciona y copia manualmente"; setTimeout(()=>boton.textContent=t,2200);} return false; }
}
function ceja(t){ return h("div",{class:"ceja",text:t}); }
function titulo(cejaT, h2, p){ return h("div",{class:"titulo-sec"}, ceja(cejaT), h("h2",{text:h2}), p?h("p",{text:p}):null); }

/* redimensiona una imagen subida a JPEG ≤ max px y la devuelve como data URI */
function procesarImagen(file,max){
  return new Promise((ok,mal)=>{
    if(!file || !/^image\/(jpeg|png|webp)$/.test(file.type)) return mal(new Error("Usa una imagen JPG, PNG o WEBP."));
    if(file.size>15*1024*1024) return mal(new Error("La imagen supera 15 MB."));
    const r=new FileReader();
    r.onerror=()=>mal(new Error("No se pudo leer el archivo."));
    r.onload=()=>{ const im=new Image(); im.onerror=()=>mal(new Error("El archivo no es una imagen válida."));
      im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
        const g=c.getContext("2d"); g.fillStyle="#0D0D0D"; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height); ok(c.toDataURL("image/jpeg",0.8)); };
      im.src=r.result; };
    r.readAsDataURL(file);
  });
}

        btnPub.disabled=false; estado.className="estado-guardado mal";
        const M={not_writer:"Tu cuenta no tiene permiso para editar este sitio.",not_granted:"La publicación desde la página no está habilitada en esta vista.",
          conflict:"Se publicó otra versión mientras editabas. El sitio se recargará con esa versión; vuelve a aplicar tus cambios.",
          rate_limited:"Demasiadas publicaciones seguidas. Espera un minuto y vuelve a intentarlo.",
          capability_disabled:"La publicación desde la página está desactivada en esta vista (por ejemplo, desde el enlace público)."};
        estado.textContent=M[c]||("No se pudo publicar ("+(c||"error")+"). Inténtalo de nuevo en unos minutos.");
        if(c==="not_granted"||c==="capability_disabled"){
          const json=JSON.stringify(borrador);
          cuerpo.prepend(h("div",{class:"aviso",style:"margin:0"},h("p",{text:"Tus cambios no se han perdido. Cópialos y pégalos en la conversación con Claude para publicarlos."}),
            h("button",{class:"btn btn-oro btn-chico",type:"button",style:"margin-top:.6rem",text:"Copiar cambios",onclick:(x)=>copiar(json,x.currentTarget)})));
        }
      }
    };
    await intento(false);
  }
  document.body.append(velo); dibujar(); tamano();
}

render();
if(location.hash && location.hash!=="#admin"){ const t=document.getElementById(location.hash.slice(1)); if(t) t.scrollIntoView(); }
})();
</script>
